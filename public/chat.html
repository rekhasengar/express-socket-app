<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Interface</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100">
  <div class="w-full justify-between items-stretch h-screen flex flex-shrink-0">
    <div class="w-1/3 relative ring-white overflow-y-auto px-4">
      <div class="z-10 w-full sticky top-0 bg-dark py-4 flex justify-between items-center gap-4">
        <button type="button" class="focus:outline-none text-white bg-purple-700 hover:bg-purple-800 focus:ring-4 focus:ring-purple-300 font-medium rounded-xl text-sm px-5 py-4 mb-2 dark:bg-purple-600 dark:hover:bg-purple-700 dark:focus:ring-purple-900 flex-shrink-0">
          Log Out
        </button>

        <input type="text" placeholder="Search user or group..." id="searchQuery" class="px-4 py-2 border rounded-xl" />

        <button onClick="setOpenAddChat(true)" class="rounded-xl border-none bg-primary text-white py-4 px-5 flex flex-shrink-0">
          + Add chat
        </button>
      </div>

      <div id="chats" class="flex justify-center items-center h-[calc(100%-88px)]">
        <!-- Typing animation or chat list will be inserted here -->
      </div>
    </div>

    <div class="w-2/3 border-l-[0.1px] border-secondary">
      <div id="currentChatHeader" class="p-4 sticky top-0 bg-dark z-20 flex justify-between items-center w-full border-b-[0.1px] border-secondary">
        <div class="flex justify-start items-center w-max gap-3">
          <div class="w-12 relative h-12 flex-shrink-0 flex justify-start items-center flex-nowrap">
            <!-- Participant Avatars for group chat will go here -->
          </div>
          <div>
            <p class="font-bold" id="chatTitle">Chat Title</p>
            <small class="text-zinc-400" id="chatDescription">Description</small>
          </div>
        </div>
      </div>

      <div id="messageWindow" class="p-8 overflow-y-auto flex flex-col-reverse gap-6 w-full">
        <!-- Chat messages will be inserted here -->
      </div>

      <div class="grid gap-4 grid-cols-5 p-4 justify-start max-w-fit" id="attachedFiles">
        <!-- File attachments will be inserted here -->
      </div>

      <div class="sticky top-full p-4 flex justify-between items-center w-full gap-2 border-t-[0.1px] border-secondary">
        <input hidden id="attachments" type="file" value="" multiple max="5" onChange="handleFileChange(event)" />
        <label for="attachments" class="p-4 rounded-full bg-dark hover:bg-secondary">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 13V8a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v10a4 4 0 0 0 4 4h10a4 4 0 0 0 4-4v-5"></path><polyline points="7 3 12 8 17 3"></polyline></svg>
        </label>

        <input type="text" placeholder="Message" id="messageInput" class="px-4 py-2 border rounded-xl w-full" onKeyDown="sendMessage(event)" />

        <button onClick="sendChatMessage()" id="sendMessageButton" disabled class="p-4 rounded-full bg-dark hover:bg-secondary disabled:opacity-50">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2L11 14l-3-3 9-3-9-3L21 2z"></path></svg>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Example variables for the chat logic
    let currentChat = { current: { _id: '123', title: 'Sample Chat', isGroupChat: false } };
    let socket = { emit: (event, chatId) => console.log(`${event} emitted for chat: ${chatId}`) };
    let message = '';
    let attachedFiles = [];
    let messages = [];
    let user = { _id: 'user1' };

    const STOP_TYPING_EVENT = 'STOP_TYPING_EVENT';

    // Function to simulate sending chat message
    const sendChatMessage = async () => {
      // If no current chat ID exists or there's no socket connection, exit the function
      if (!currentChat.current?._id || !socket) return;

      // Emit a STOP_TYPING_EVENT to inform other users/participants that typing has stopped
      socket.emit(STOP_TYPING_EVENT, currentChat.current?._id);

      // Simulate the message sending process and update the UI on success
      setTimeout(() => {
        const res = { data: { _id: 'message1', content: message } };  // Simulate response
        setMessage(''); // Clear the message input
        setAttachedFiles([]); // Clear the list of attached files
        messages = [res.data, ...messages]; // Update messages in the UI
        updateChatLastMessage(currentChat.current?._id || '', res.data); // Update the last message in the chat
        console.log('Message Sent:', res.data);
      }, 1000);
    };

    // Helper function to set the message state
    const setMessage = (newMessage) => {
      message = newMessage;
      document.getElementById('messageInput').value = newMessage;
      document.getElementById('sendMessageButton').disabled = !newMessage && attachedFiles.length <= 0;
    };

    // Helper function to update the last message in the chat
    const updateChatLastMessage = (chatId, messageData) => {
      console.log(`Updated last message for chat ${chatId}: ${messageData.content}`);
    };

    // Function to handle file input change
    const handleFileChange = (event) => {
      attachedFiles = [...event.target.files];
      console.log('Attached files:', attachedFiles);
    };

    // Function to handle message input change
    const sendMessage = (event) => {
      if (event.key === 'Enter') {
        sendChatMessage();
      }
    };

  </script>
</body>
</html>
