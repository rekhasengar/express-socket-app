<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Layout</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background-color: #1e1e2f;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background-color: #2c2c3c;
    }
    .navbar button, .navbar input {
      border: none;
      outline: none;
      padding: 10px;
      border-radius: 5px;
    }
    .navbar button {
      cursor: pointer;
      color: #fff;
    }
    .logout {
      background-color: #6c47ff;
    }
    .add-chat {
      background-color: #4a90e2;
    }
    .search {
      flex-grow: 1;
      margin: 0 10px;
      padding: 10px;
      color: #000;
    }
    .content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      flex-grow: 1;
      padding: 20px;
    }
    .placeholder {
      font-size: 24px;
      color: #888;
    }
    .user-list {
      width: 100%;
      margin-top: 20px;
      max-height: 300px;
      overflow-y: auto;
    }
    .user-item {
      padding: 10px;
      background-color: #2c2c3c;
      margin: 5px 0;
      border-radius: 5px;
      cursor: pointer;
    }
    .user-item:hover {
      background-color: #3c3c4c;
    }
  </style>
</head>
<body>
  <div class="navbar">
    <button class="logout">Log Out</button>
    <input type="text" class="search" placeholder="select user...">
    <button class="add-chat">+ Add chat</button>
  </div>
  <div class="content">
    <div class="placeholder">No chat selected</div>
    <div class="user-list" id="user-list"></div>
  </div>


  <script>
    document.querySelector('.search').addEventListener('input', async (event) => {
      const searchQuery = event.target.value;
  
      // Only make an API request if the search query is not empty
      if (searchQuery.trim() !== '') {
        try {
          const response = await fetch(`http://localhost:3000/api/v2/conversations/current-users?search=${searchQuery}`);
          const data = await response.json();
          const userListContainer = document.getElementById('user-list');
          userListContainer.innerHTML = ''; // Clear any previous results
  
          if (data && data.body && data.body.users && data.body.users.length > 0) {
            // Display users
            data.body.users.forEach(user => {
              const userItem = document.createElement('div');
              userItem.classList.add('user-item');
              userItem.textContent = `${user.firstName} ${user.lastName}`; // Concatenate first and last name
              userListContainer.appendChild(userItem);
            });
          } else {
            userListContainer.innerHTML = '<div>No users found</div>';
          }
        } catch (error) {
          console.error('Error fetching users:', error);
        }
      } else {
        document.getElementById('user-list').innerHTML = ''; // Clear user list when input is empty
      }
    });
  </script>
  
</body>
</html>
