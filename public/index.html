<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatsapp Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <style>
      #messageContainer {
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
        height: 400px;
        overflow-y: auto;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      #messageContainer::-webkit-scrollbar {
        width: 8px;
      }
      #messageContainer::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 10px;
        max-width: 70%;
        word-wrap: break-word;
      }
      .message.received {
        background: #e1f3fb;
        color: #000;
        text-align: left;
      }
      .message.sent {
        background: #dcf8c6;
        color: #000;
        text-align: right;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <h1>Whatsapp Chat App</h1>
    <p id="userEmail" style="font-weight: bold; color: #555"></p>
    <div>
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message here"
        style="width: 300px; padding: 10px; margin-right: 10px"
      />
      <button id="sendMessageButton">Send Message</button>
    </div>
    <div id="messageContainer"></div>

    <script>
      // Retrieve the token from localStorage
      const token = localStorage.getItem('authToken');

      if (!token) {
        alert('You are not authenticated. Redirecting to login page.');
        window.location.href = '/login.html';
      } else {
        try {
          // Decode the token to extract user details
          const decodedToken = jwt_decode(token);
          const userEmail = decodedToken.email; // Assumes token has an 'email' field
          const emailDisplay = document.getElementById('userEmail');

          if (userEmail) {
            emailDisplay.textContent = `Logged in as: ${userEmail}`;
          } else {
            emailDisplay.textContent = 'Email not found in token.';
          }
        } catch (error) {
          console.error('Error decoding token:', error);
          alert('Invalid token. Redirecting to login page.');
          window.location.href = '/login.html';
        }

        // Connect to the backend using the token
        const socket = io('http://localhost:3000', {
          auth: {
            token: token,
          },
        });

        socket.on('connected', () => {
          console.log('Connected successfully!');
        });

        // Handle user going offline (tab or window close)
        window.addEventListener('beforeunload', () => {
          if (socket && socket.connected) {
            socket.emit('inactiveUser', { socketId: socket.id });
            console.log('User inactive event sent to the server:', { socketId: socket.id });
          }
        });

        // Listen for a message from the server
        socket.on('receiveMessage', (data) => {
          console.log('Received message from backend:', data.message.message);
          displayMessage(data.message.message, 'received');
        });

        socket.on('userStatus', (data) => {
          console.log('Received status update:', data.message.message);
          displayMessage(data.message.message, 'received');
        });

        socket.on('joinChat', (data) => {
          console.log('Received group update:', data.message.message);
          displayMessage(data.message.message, 'received');
        });

        socket.on('renameGroup', (data) => {
          console.log('Received group update:', data.message.message);
          displayMessage(data.message.message, 'received');
        });

        socket.on('updateUserRoleInGroup', (data) => {
          console.log('Received group update:', data.message.message);
          displayMessage(data.message.message, 'received');
        });

        socket.on('socketError', (data) => {
          console.log('Error occurred: ', data);
        });

        function displayMessage(messageText, type) {
          const messageContainer = document.getElementById('messageContainer');
          const messageWrapper = document.createElement('div');
          const messageElement = document.createElement('div');

          // Apply styles for received/sent messages
          messageElement.classList.add('message', type);

          messageElement.textContent = messageText;
          messageWrapper.appendChild(messageElement);
          messageContainer.appendChild(messageWrapper);

          // Scroll to the bottom of the container
          messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        // Send a message to the server
        document.getElementById('sendMessageButton').addEventListener('click', () => {
          const messageInput = document.getElementById('messageInput');
          const messageText = messageInput.value.trim();
          if (messageText === '') {
            alert('Message cannot be empty!');
            return;
          }

          const uuid = crypto.randomUUID();
          const decodedToken = jwt_decode(token);
          const userId = decodedToken.id;
          const payload = {
            // eventType: 'updateUserRoleInGroup',
            // socketId: socket.id,
            // data: {
            //   conversationId: '7e989195-3742-4f39-adf5-56b5508b4a18',
            //   senderId: userId,
            //   message: {
            //     id: uuid,
            //     message: messageText,
            //     timestamp: new Date().getTime(),
            //   },
            // },
            eventType: 'addUserInGroup',
            socketId: socket.id,
            data: {
              adminId: userId,
              userId: ['e2c0e0fa-15f9-43e5-8496-3bdb8eb72557'],
              conversationId: '7e989195-3742-4f39-adf5-56b5508b4a18',
            },
          };

          socket.emit('event', payload);
          displayMessage(messageText, 'sent'); // Display the message immediately
          console.log('Message sent successfully!');
          messageInput.value = ''; // Clear the input after sending the message
          socket.on('errorEvent', (error) => {
            console.error('Error received from server:', error);

            // Handle the error (e.g., display to the user)
            alert(`Error: ${error.message} (Status: ${error.status})`);
            if (error.stack) {
              console.log('Stack Trace:', error.stack);
            }
          });
        });
      }
    </script>
  </body>
</html>
