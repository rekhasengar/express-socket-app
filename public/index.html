<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conversations</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
      /* Add your styling here */

      body {
        font-family: Arial, sans-serif;
        background-color: #2c2c2c;
        color: white;
        margin: 0;
        padding: 50px;
      }

      #header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0;
      }

      #conversationBlock {
        display: flex;
        justify-content: left;
        align-items: center;
      }

      #conversationHeading {
        font-size: 20px;
        margin: 0;
        padding: 5px;
      }

      #createConversation {
        margin: 0;
        margin-left: 5px;
        align-items: center;
      }

      #userProfileBlock {
        display: flex;
        justify-content: right;
        align-items: center;
      }

      #userEmailBlock {
        margin: 0;
        margin-right: 10px;
        display: flex;
        justify-items: center;
        flex-direction: column;
      }

      #userName {
        margin: 0;
      }

      #logoutPera {
        margin: 0;
        text-align: right;
      }
      #logoutPera a {
        color: #5757ff;
      }

      .conversation-list {
        list-style-type: none;
        padding: 0;
      }
      .conversation-item {
        padding: 10px;
        color: white;
        border: none;
        border-radius: 4px;
        background-color: #5757ff;
        margin-bottom: 10px;
        cursor: pointer;
      }
      .conversation-item:hover {
        background-color: #b4b4e4;
      }
    </style>
    <script>
      function _getToken() {
        // Retrieve the token from localStorage
        const token = localStorage.getItem('authToken');
        return token;
      }
      const token = _getToken();
      if (!token) {
        alert('You are not authenticated. Redirecting to login page.');
        window.location.href = '/login.html';
      }
      const decodedToken = jwt_decode(token);
      const userEmail = decodedToken.email;
      const userId = decodedToken.id.toLowerCase();
    </script>
  </head>
  <body>
    <div id="header">
      <div id="conversationBlock">
        <p id="conversationHeading">Conversations</p>
        <p id="createConversation">
          <i class="fa-sharp fa-solid fa-circle-plus fa-xl" style="color: #5757ff"></i>
        </p>
      </div>
      <div id="userProfileBlock">
        <div id="userEmailBlock">
          <p id="userName"></p>
          <p id="logoutPera"><a href="/login.html">Logout</a></p>
        </div>
        <i
          class="fa-duotone fa-solid fa-circle-user fa-2xl"
          style="--fa-primary-color: #d30d0d; --fa-secondary-color: #d30d0d; --fa-secondary-opacity: 0.4"
        ></i>
      </div>
    </div>

    <ul id="conversationList" class="conversation-list">
      <!-- Conversation items will be dynamically loaded here -->
    </ul>

    <script>
      const userNameElement = document.getElementById('userName');
      userNameElement.textContent = `${userEmail} `;

      // Fetch conversations and display them
      async function loadConversations() {
        try {
          const apiUrl = 'http://localhost:3000/api/v1/conversations';
          const response = await fetch(apiUrl, {
            method: 'GET',
            headers: {
              Authorization: 'Bearer ' + token, // fetching the token when redirecting login page to the index page
            },
          });
          const data = await response.json();

          if (data.status == 200) {
            const conversationList = document.getElementById('conversationList');

            // Clear existing list (if any)
            conversationList.innerHTML = '';

            // Loop through the conversations and add them to the list
            const conversations = data.body.conversations;
            conversations.forEach((conversation) => {
              const listItem = document.createElement('li');
              listItem.classList.add('conversation-item');
              if (conversation.isGroupChat) {
                const memberNames = conversation.members.map(
                  (member) => `${member.user.firstName} ${member.user.lastName}`,
                );
                listItem.innerHTML = `<b>${conversation.name}</b> - (${memberNames})`;
              } else {
                listItem.innerHTML = `<b>${conversation.name}</b>`;
              }
              // Or any other field
              listItem.onclick = () => openChat(conversation.id); // Set the click event to open the chat
              conversationList.appendChild(listItem);
            });
          } else {
            alert('No conversations available or failed to fetch conversations.');
          }
        } catch (error) {
          console.error('Error fetching conversations:', error);
        }
      }

      const socket = io('http://localhost:3000', {
        auth: {
          token: token,
        },
      });

      socket.on('connected', () => {
        console.log('Connected successfully!');
      });

      socket.on('joinChat', (data) => {
        loadConversations();
      });

      // Redirect to chat.html with the selected conversationId
      function openChat(conversationId) {
        socket.close();
        window.location.href = `chat.html?conversationId=${conversationId}`;
      }

      // Load the conversations when the page is ready
      window.onload = loadConversations;
    </script>
  </body>
</html>
