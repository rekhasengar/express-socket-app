<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatsapp Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <style>
      #messageContainer {
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
        height: 400px;
        overflow-y: auto;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      #messageContainer::-webkit-scrollbar {
        width: 8px;
      }
      #messageContainer::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 10px;
        max-width: 70%;
        word-wrap: break-word;
      }
      .message.received {
        background: #e1f3fb;
        color: #000;
        text-align: left;
      }
      .message.sent {
        background: #dcf8c6;
        color: #000;
        text-align: right;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <h1>Whatsapp Chat App</h1>
    <p id="userEmail" style="font-weight: bold; color: #555"></p>
    <div>
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message here"
        style="width: 300px; padding: 10px; margin-right: 10px"
      />
      <button id="sendMessageButton">Send Message</button>
    </div>
    <div id="messageContainer"></div>

    <script src="socket.js"></script>
  </body>
</html>
