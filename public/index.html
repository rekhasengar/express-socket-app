<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatsapp Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
  </head>
  <body>
    <h1>Whatsapp Chat App</h1>
    <button id="sendMessageButton">Send Message</button>

    <script>
      // Retrieve the token from localStorage
      const token = localStorage.getItem('authToken');

      if (!token) {
        alert('You are not authenticated. Redirecting to login page.');
        window.location.href = '/login.html';
      } else {
        // Connect to the backend using the token
        const socket = io('http://localhost:3000', {
          auth: {
            token: token,
          },
        });

        // Listen for a message from the server
        socket.on('message', (data) => {
          console.log('Received message from backend:', data);
        });

        socket.on('connected',() => {
          console.log("Connected successfully!")
        })

        // Send a message to the server
        document.getElementById('sendMessageButton').addEventListener('click', () => {
          const payload = {
            eventType: 'adminAddUserInGroup',
            socketId: socket.id, // Use the current socket ID
            data: {
              conversationId: '693a52c9-dd5c-4028-9197-8fc8f8d0143b',
              userId: '81b62a92-c55c-4a4b-aac5-de544f905195',
              message: {
                id: '81b62a92-c55c-4a4b-aac5-de544f905195',
                message: 'Hello, How are you',
                timestamp: new Date().getTime(),
              },
            },
          };

          socket.emit('event', payload);
        });
      }
    </script>
  </body>
</html>
