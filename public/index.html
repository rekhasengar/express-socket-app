<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whatsapp Chat App</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <style>
      #messageContainer {
        max-width: 600px;
        margin: 20px auto;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 10px;
        background: #f9f9f9;
        height: 400px;
        overflow-y: auto;
        font-family: Arial, sans-serif;
        font-size: 14px;
      }
      #messageContainer::-webkit-scrollbar {
        width: 8px;
      }
      #messageContainer::-webkit-scrollbar-thumb {
        background: #ccc;
        border-radius: 4px;
      }
      .message {
        margin: 5px 0;
        padding: 10px;
        border-radius: 10px;
        max-width: 70%;
        word-wrap: break-word;
      }
      .message.received {
        background: #e1f3fb;
        color: #000;
        text-align: left;
      }
      .message.sent {
        background: #dcf8c6;
        color: #000;
        text-align: right;
        margin-left: auto;
      }
    </style>
  </head>
  <body>
    <h1>Whatsapp Chat App</h1>
    <p id="userEmail" style="font-weight: bold; color: #555"></p>
    <div>
      <input
        type="text"
        id="messageInput"
        placeholder="Type your message here"
        style="width: 300px; padding: 10px; margin-right: 10px"
      />
      <button id="sendMessageButton">Send Message</button>
    </div>
    <div id="messageContainer"></div>

    <script>
      let userId;
      let userEmail;

      function _checkToken() {
        // Retrieve the token from localStorage
        const token = localStorage.getItem('authToken');
        if (!token) {
          alert('You are not authenticated. Redirecting to login page.');
          window.location.href = '/login.html';
        }
      }

      function _decodeTokenAndDisplayEmail(token) {
        try {
          //Decoding user auth token.
          const decodedToken = jwt_decode(token);
          userEmail = decodedToken.email;
          userId = decodedToken.id;

          const emailDisplay = document.getElementById('userEmail');
          if (userEmail) {
            emailDisplay.textContent = `Logged in as: ${userEmail}`;
          } else {
            emailDisplay.textContent = 'Email not found in token.';
          }
        } catch (error) {
          alert('Invalid token. Redirecting to login page.');
          window.location.href = '/login.html';
        }
      }

      function displayMessage(messageText, type) {
        const messageContainer = document.getElementById('messageContainer');
        const messageWrapper = document.createElement('div');
        const messageElement = document.createElement('div');

        // Apply styles for received/sent messages
        messageElement.classList.add('message', type);

        messageElement.textContent = messageText;
        messageWrapper.appendChild(messageElement);
        messageContainer.appendChild(messageWrapper);

        // Scroll to the bottom of the container
        messageContainer.scrollTop = messageContainer.scrollHeight;
      }

      // Connect to the backend using the token
      const socket = io('http://localhost:3000', {
        auth: {
          token: token,
        },
      });

      socket.on('connected', () => {
        console.log('Connected successfully!');
      });

      // Listen for a message from the server
      socket.on('receiveMessage', (data) => {
        console.log('Message received from backend successfully, message: ', data.message.message);
        const messageStatusPayload = {
          conversationId: data.conversationId,
          userId: userId,
          messageId: data.message.id,
          status: 'delivered',
          timestamp: new Date().getTime(),
          timezone: 'Asia/Kolkata',
        };
        socket.emit('messageStatus', payload);
        displayMessage(data.message.message, 'received');
      });

      socket.on('messageStatus', (data) => {
        console.log('Message status event received successfully, data: ', data.message.message);
      });

      socket.on('deleteMessage', (data) => {
        console.log('Message deleted event received successfully, data: ', data.message.message);
      });

      socket.on('userStatus', (data) => {
        console.log('User status event received successfully, data: ', data);
      });

      socket.on('joinChat', (data) => {
        console.log('Join chat event received successfully, data: ', data);
      });

      socket.on('removeUserFromGroup', (data) => {
        console.log('User removed from group event received successfully, data: ', data);
      });

      socket.on('addUserInGroup', (data) => {
        console.log('Add user in group event received successfully, data: ', data);
      });

      socket.on('leaveGroup', (data) => {
        console.log('Leave group event received successfully, data: ', data.message.message);
      });

      socket.on('renameGroup', (data) => {
        console.log('Renamed group event received successfully, data: ', data.message.message);
      });

      socket.on('updateUserRoleInGroup', (data) => {
        console.log('Update user role in group event received successfully, data: ', data.message.message);
      });

      socket.on('socketError', (data) => {
        console.log('Socket error event received successfully, data: ', data.message.message);
      });

      // Send a message to the server
      document.getElementById('sendMessageButton').addEventListener('click', () => {
        const messageInput = document.getElementById('messageInput');
        const messageText = messageInput.value.trim();
        if (messageText === '') {
          alert('Message cannot be empty!');
          return;
        }

        const uuid = crypto.randomUUID();
        const decodedToken = jwt_decode(token);
        const userId = decodedToken.id;
        const payload = {
          eventType: 'sendMessage',
          socketId: socket.id,
          data: {
            conversationId: '7e989195-3742-4f39-adf5-56b5508b4a18',
            senderId: userId,
            message: {
              id: uuid,
              message: messageText,
              timestamp: new Date().getTime(),
            },
          },
        };

        socket.emit('event', payload);
        displayMessage(messageText, 'sent'); // Display the message immediately
        console.log('Message sent successfully!');
        messageInput.value = ''; // Clear the input after sending the message
      });
    </script>
  </body>
</html>
