<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Chat Page</title>
    <script src="https://cdn.jsdelivr.net/npm/jwt-decode/build/jwt-decode.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Arial', sans-serif;
        background-color: #1e1e1e;
        color: #ffffff;
        display: flex;
        height: 100vh;
        border: 2px solid #444; /* Border around the entire page */
      }

      .container {
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .header {
        display: flex;
        align-items: center;
        padding: 15px;
        background-color: #272727;
      }

      .header button {
        margin-right: 10px;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        font-size: 14px;
        cursor: pointer;
        font-weight: bold;
      }

      .logout-btn {
        background-color: #8e44ad;
        color: white;
      }

      .logout-btn:hover {
        background-color: #732d91;
      }

      .add-chat-btn {
        background-color: #3498db;
        color: white;
      }

      .add-chat-btn:hover {
        background-color: #217dbb;
      }

      .search-box {
        width: 300px;
        background-color: #333;
        color: white;
        border: none;
        border-radius: 5px;
        padding: 10px;
        font-size: 14px;
        margin-right: 6px;
        outline: none;
      }

      /* Right panel for conversations */
      .right-panel {
        display: flex;
        flex-direction: column;
        width: 700px;
        background-color: #333;
        border-left: 2px solid #444; /* Border to separate right panel */
        padding: 10px;
      }

      .conversation-btn {
        margin-bottom: 15px;
        padding: 10px 20px;
        background-color: #2ecc71;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
      }

      .conversation-btn:hover {
        background-color: #27ae60;
      }

      .conversation-list {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        border-radius: 5px;
        background-color: #444;
      }

      .conversation-item {
        padding: 15px;
        margin-bottom: 10px;
        background-color: #555;
        border-radius: 5px;
        cursor: pointer;
        color: white;
      }

      .conversation-item:hover {
        background-color: #666;
      }

      .main {
        display: flex;
        flex: 1;
        justify-content: center;
        align-items: center;
        background-color: #1e1e1e;
        color: #bbb;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <div class="header">
        <button id="logoutButton" class="logout-btn">Log Out</button>
        <input type="text" class="search-box" placeholder="Search users..." />
        <button id="add-chat-btn" class="add-chat-btn">+ Add chat</button>
      </div>

      <!-- Main content -->
      <div class="main">
        <div id="placeholder" class="chat-placeholder">No chat selected</div>
      </div>
    </div>

    <!-- Right panel -->
    <div class="right-panel">
      <button id="conversation-btn" class="conversation-btn">Conversations</button>
      <div id="conversation-list" class="conversation-list">
        <!-- Conversations will be populated here -->
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function () {
        const token = localStorage.getItem('authToken');
        if (!token) {
          alert('You are not authenticated. Redirecting to login page.');
          window.location.href = 'login.html';
        }

        const decodedToken = jwt_decode(token);
        const userId = decodedToken.id;

        if (!userId) {
          alert('User ID not found. Please log in.');
          window.location.href = 'login.html';
        }

        const logoutButton = document.getElementById('logoutButton');
        logoutButton.addEventListener('click', async () => {
          try {
            const response = await fetch(`http://localhost:3000/api/v2/auth/logout/${userId}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('authToken')}`,
              },
            });

            if (response.ok) {
              alert('Logged out successfully!');
              localStorage.clear();
              window.location.href = '/login.html';
            } else {
              const errorData = await response.json();
              alert(`Logout failed: ${errorData.message}`);
            }
          } catch (error) {
            console.error('Logout error:', error);
          }
        });

        // Fetch conversations on button click
        const conversationBtn = document.getElementById('conversation-btn');
        const conversationList = document.getElementById('conversation-list');
        conversationBtn.addEventListener('click', async () => {
          try {
            const response = await fetch('http://localhost:3000/api/v2/conversations/', {
              method: 'GET',
              headers: {
                'Content-Type': 'application/json',
                Authorization: `Bearer ${localStorage.getItem('authToken')}`,
              },
            });

            const data = await response.json();
            if (response.ok) {
              conversationList.innerHTML = ''; // Clear the list
              data.body.conversations.forEach((conversation) => {
                const conversationDiv = document.createElement('div');
                conversationDiv.classList.add('conversation-item');
                conversationDiv.textContent = conversation.name;
                conversationDiv.addEventListener('click', () => {
                  alert(`Conversation with ${conversation.name} selected.`);
                });
                conversationList.appendChild(conversationDiv);
              });
            } else {
              console.error('Error fetching conversations:', data.message);
            }
          } catch (error) {
            console.error('Fetch error:', error);
          }
        });
      });
    </script>
  </body>
</html>
