<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search User</title>
    <style>
      /* Styling for container */
      .container {
        width: 40vw;
        height: 100vh;
        margin: auto auto;
        display: flex;
        align-items: center;
        justify-content: flex-start;
        gap: 10px;
      }

      /* Styling for search input */
      #searchUser {
        width: 600px;
        padding: 10px;
      }

      /* Styling for logout button */
      #logout {
        padding: 10px 20px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }

      #logout:hover {
        background-color: #218838;
      }

      /* Dropdown styling for user list */
      .user-list {
        display: none;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #ccc;
        margin-top: 10px;
        padding: 10px;
        position: absolute;
        background-color: white;
        width: 220px;
      }

      .user {
        padding: 8px;
        cursor: pointer;
      }

      .user:hover {
        background-color: #f0f0f0;
      }

      /* Chat button styling */
      .start-chat-button {
        padding: 10px 20px;
        background-color: #28a745;
        color: lightblue;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        display: none; /* Hidden initially */
      }

      .start-chat-button:hover {
        background-color: #218838;
      }

      /* Chat container styling */
      .chat-container {
        margin-top: 50px;
      }

      .chat-header {
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="logout">Logout</button>

      <!-- Added select dropdown for multiple users -->
      <select id="userSelect" name="users" style="padding: 10px; width: 200px;" multiple>
        <option value="">Select users</option>
      </select>

      <div id="userList" class="user-list"></div>
      <!-- Start Chat button -->
      <button id="startChatButton" class="start-chat-button">Start Chat</button>
    </div>

    <script>
      const userSelect = document.getElementById('userSelect');
      const startChatButton = document.getElementById('startChatButton');
      const logoutButton = document.getElementById('logout');
      const selectedUsers = [];

      // Mock API endpoints (replace these URLs with actual API URLs)
      const getActiveUsersApi = 'http://localhost:3000/api/v2/conversation/current-users';

      // Fetch active users when page loads
      window.addEventListener('load', async () => {
        try {
          const response = await fetch(getActiveUsersApi);
          const data = await response.json();
          const users = data.body?.users || [];

          if (users.length > 0) {
            userSelect.innerHTML = '<option value="">Select users</option>'; // Reset the dropdown options
            users.forEach((user) => {
              const option = document.createElement('option');
              option.value = user.id;
              option.textContent = `${user.firstName} ${user.lastName}`; // Display full name
              userSelect.appendChild(option);
            });
          } else {
            userSelect.innerHTML = '<option>No active users found</option>';
          }
        } catch (error) {
          console.error('Error fetching active users:', error);
          userSelect.innerHTML = '<option>Error loading users</option>';
        }
      });

      // Detect user selection from the dropdown (multiple users)
      userSelect.addEventListener('change', () => {
        // Clear selected users array and populate with currently selected users
        const selectedOptions = Array.from(userSelect.selectedOptions);
        selectedUsers.length = 0;
        selectedOptions.forEach(option => {
          const selectedUser = {
            id: option.value,
            name: option.textContent
          };
          selectedUsers.push(selectedUser);
        });

        // Enable chat button when 1 or more users are selected
        if (selectedUsers.length > 0) {
          startChatButton.style.display = 'inline-block';
        } else {
          startChatButton.style.display = 'none';
        }
      });

      // Start chat (Redirect to another page)
      startChatButton.addEventListener('click', () => {
        if (selectedUsers.length === 0) {
          alert('Please select at least one user.');
          return;
        }

        // Store selected users in localStorage or sessionStorage to pass to the next page
        localStorage.setItem('selectedUsers', JSON.stringify(selectedUsers));

        // Redirect to the chat page
        window.location.href = 'chat-page.html'; // Replace with your actual URL
      });

      // Logout button functionality
      logoutButton.addEventListener('click', () => {
        alert('Logging out...');
        // Add logout logic here, e.g., redirect to login page or clear session
      });
    </script>
  </body>
</html>
